# Private direct-IP trial; populated only while RustDesk is stopped.
rendezvous_server = '127.0.0.1:9'
nat_type = 0
serial = 0
unlock_pin = ''
trusted_devices = ''

[options]
custom-rendezvous-server = '127.0.0.1:9'
relay-server = '127.0.0.1:9'
api-server = 'http://127.0.0.1:9'
direct-server = 'Y'
direct-access-port = '21118'
stop-service = 'N'
whitelist = '__MOBILE_IPV4_ALLOWLIST__'
approve-mode = 'password'
verification-method = 'use-temporary-password'
temporary-password-length = '10'
access-mode = 'custom'
enable-keyboard = 'Y'
enable-clipboard = 'Y'
enable-file-transfer = 'N'
enable-camera = 'N'
enable-terminal = 'N'
enable-remote-printer = 'N'
enable-audio = 'N'
enable-tunnel = 'N'
enable-remote-restart = 'N'
enable-record-session = 'N'
enable-block-input = 'N'
enable-privacy-mode = 'N'
enable-lan-discovery = 'N'
enable-udp-punch = 'N'
enable-ipv6-punch = 'N'
enable-trusted-devices = 'N'
allow-remote-config-modification = 'N'
allow-remote-cm-modification = 'N'
enable-perm-change-in-accept-window = 'N'
allow-auto-record-incoming = 'N'
allow-auto-record-outgoing = 'N'
allow-auto-update = 'N'
allow-websocket = 'N'
allow-insecure-tls-fallback = 'N'
allow-logon-screen-password = 'N'
lang = 'zh-cn'
