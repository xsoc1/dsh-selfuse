# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 技能路由提示段（普通 Cordis 插件，非 bundle，经 patch 装配）。
- insert:
    - id: dsh-skill-router
      name: '@dsh-external/dsh-skill-router'
# DeepSeek Harness EAC companion plugins (synced from Deepseek-Harness-EAC assets/plugins)
# web 壳桥：纯 web 环境补全 window.dshDesktop（余额推送 / 一键还原 / 系统打开），
# 需先于 balance / client-file-changes 注册，使客户端组件挂载时桥已就位。
- insert:
    - id: web-shell-bridge
      name: '@deepseek-ai/dsh-web-shell-bridge'
- insert:
    - id: balance
      name: '@deepseek-ai/dsh-balance'
- insert:
    - id: file-changes
      name: '@deepseek-ai/dsh-file-changes'
- insert:
    - id: client-file-changes
      name: '@deepseek-ai/dsh-client-file-changes'
- insert:
    - id: shell-terminal
      name: '@deepseek-ai/dsh-shell-terminal'
- insert:
    - id: easy-setup
      name: '@deepseek-ai/dsh-easy-setup'
- insert:
    - id: task-notify
      name: '@deepseek-ai/dsh-task-notify'
# 2026-08-22 本地维护：dsh-web-ui-all 内不用的子插件不进入装配
# （pet / describe-image / aionui-panel / liangshen / skill-explorer /
# desktop-launcher / plugin-manager）——对应装配行已从
# @linxin666/dsh-web-ui-all/cordis.patch.yml 移除；包目录必须保留，
# dsh 0.1.1 client-modules 按依赖路径加载 client.js，删目录会报
# "bundle script ... failed to load"。
# 聚合包自带的 dsh-better-sidebar 行仍保留禁用（本地 0.12.2 独立生效）。
- id: web-ui-better-sidebar
  disabled: true
